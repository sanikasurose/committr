spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 1s
      timeout: 1s

security:
  encryption-key: "0123456789abcdef0123456789abcdef"

github:
  oauth:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/auth/callback
    scope: "read:user repo"
    user-agent: "Committr-Test"

committr:
  session:
    ttl: 30m
    cookie-name: sessionId
    redis-startup-test: false
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
