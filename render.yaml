services:
  - type: web
    name: committr-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: committr-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: committr-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: committr-postgres
          property: password
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        value: https://committr-backend.onrender.com/api/auth/callback
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        value: https://sanikasurose.github.io/committr
      # Render removed free Redis in 2024. Set SPRING_DATA_REDIS_HOST and
      # SPRING_DATA_REDIS_PORT manually if you provision an external Redis
      # (e.g. Upstash free tier). Without Redis, sessions will not persist
      # across backend restarts — acceptable for portfolio demos.
      - key: SPRING_DATA_REDIS_HOST
        value: "localhost"
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
    healthCheckPath: /api/health

databases:
  - name: committr-postgres
    plan: free
    databaseName: committr
    ipAllowList: []
